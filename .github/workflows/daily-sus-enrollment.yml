name: Daily SUS enrollment snapshot

on:
  # Run every day at 17:00 UTC
  schedule:
    - cron: '0 17 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run enrollment snapshot script
        run: |
          python scripts/osu_enrollment_snapshot_classes_api_coreed.py

      - name: Update registration calendar from the registrar
        # Adds each term's priority-registration waves to data/registration_calendar.csv
        # once the registrar posts them. Never allowed to stop the snapshot being saved.
        continue-on-error: true
        run: |
          python scripts/update_registration_calendar.py

      - name: Save today's forecast
        # Archives the dashboard's projected-final-enrolment table to forecasts/<term>/<date>.csv
        continue-on-error: true
        run: |
          python scripts/save_forecast.py

      - name: Commit and push updated data if anything changed
        run: |
          git add data/osu_enrollment_log_classes.db data/registration_calendar.csv
          if [ -d forecasts ]; then git add forecasts; fi
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
          else
            echo "Changes:"
            git diff --cached --stat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily enrollment snapshot $(date -u +'%Y-%m-%d')"
            git push
          fi
